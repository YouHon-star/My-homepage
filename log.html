<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>博客 · 幽鸿の小站</title>
<link rel="icon" type="image/png" sizes="32x32" href="Icon/tab-32.png" />
<link rel="icon" type="image/png" sizes="256x256" href="Icon/tab-256.png" />
<meta name="description" content="YoHon 的博客，记录成长的点点滴滴。" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="bg-slides" id="bgSlides"></div>
    <div class="bg-tint"></div><div class="bg-overlay"></div>
    <div class="bg-orb orb-1"></div><div class="bg-orb orb-2"></div>
    <div class="bg-cloud cloud-1"></div><div class="bg-cloud cloud-2"></div>
    <div class="bg-fireflies" id="fireflies"></div>
    <div class="bg-sakura" id="sakura"></div>
    <div class="bg-sparkles" id="sparkles"></div>
  </div>
  <div class="progress-bar" id="progressBar"></div>

  <nav class="nav" id="nav">
    <div class="container nav-inner">
      <a href="index.html" class="logo">幽鸿<span class="logo-dot"></span><span class="logo-jp">の小站</span></a>
      <div class="menu">
        <a href="index.html#about">关于</a>
        <a href="log.html" class="active">博客</a>
        <a href="links.html">友链</a>
        <a href="index.html#contact">联系</a>
        <button class="theme-toggle" id="themeToggle" aria-label="切换主题">
          <svg id="sunIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg id="moonIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <button class="menu-btn" id="menuBtn" aria-label="菜单">☰</button>
      </div>
    </div>
  </nav>

  <main class="container main blog-layout" id="pjax-main">
    <div class="section-head reveal">
      <span class="kicker">✧ BLOG ✧</span>
      <h2>我的博客</h2>
      <span class="section-line"></span>
    </div>

    <div class="blog-grid">
      <div class="blog-main">
        <button class="blog-editor-toggle" id="editorToggle">
          <span class="toggle-arrow">▾</span> 写点什么…
        </button>

        <div class="blog-editor glass card" id="blogEditor">
          <form class="blog-form" id="blogForm">
            <input id="postTitle" type="text" placeholder="标题" maxlength="60" />
            <textarea id="postContent" placeholder="开始书写…" maxlength="5000" rows="6" required></textarea>
            <div class="blog-form-row">
              <input id="postCategory" type="text" placeholder="自定义分类" maxlength="30" />
              <input id="postTags" type="text" placeholder="标签（#号分隔，如 #前端 #生活）" maxlength="100" />
            </div>
            <div class="blog-form-actions">
              <span class="char-count" id="charCount">0 字</span>
              <button type="submit" class="btn btn-primary">发布文章</button>
            </div>
          </form>
        </div>

        <div class="blog-stats glass" id="blogStats">
          <span>📝 <strong id="statPosts">0</strong> 篇文章</span>
          <span>💬 <strong id="statWords">0</strong> 字</span>
        </div>

        <div class="blog-search-wrap">
          <input class="blog-search" id="blogSearch" type="text" placeholder="搜索文章…" />
        </div>

        <div class="blog-filter-bar glass" id="filterBar"></div>

        <div class="blog-posts" id="blogPosts"></div>

        <div class="post-detail glass card" id="postDetail"></div>
      </div>

      <aside class="blog-sidebar">
        <div class="glass card sidebar-author">
          <img class="sidebar-avatar" src="profile-picture/hana.png" alt="幽鸿" />
          <h3>幽鸿 YoHon</h3>
          <p>记录成长的点点滴滴</p>
          <div class="sidebar-stats">
            <span>📝 <strong id="sidePosts">0</strong> 篇</span>
            <span>💬 <strong id="sideWords">0</strong> 字</span>
          </div>
        </div>
        <div class="glass card sidebar-card">
          <h4><span class="card-accent"></span>分类</h4>
          <ul id="categoryList"></ul>
        </div>
        <div class="glass card sidebar-card">
          <h4><span class="card-accent"></span>标签</h4>
          <div class="tag-cloud" id="tagCloud"></div>
        </div>
        <div class="glass card sidebar-card" id="archiveCard" style="display:none">
          <h4><span class="card-accent"></span>归档</h4>
          <ul id="archiveList"></ul>
        </div>
      </aside>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <div class="footer-status"><span class="status-dot"></span><span>小站已运行 <span id="uptime">00:00:00</span></span></div>
      <div class="footer-badges" id="footerBadges"></div>
      <div class="footer-copy"> YoHon · <span id="year"></span></div>
    </div>
  </footer>

  <button class="back-top" id="backTop" aria-label="回到顶部">↑</button>

  <div class="mascot-wrap" id="mascotWrap">
    <div class="mascot-bubble" id="mascotBubble">今天也要加油喵～</div>
    <div class="mascot-box" id="mascotBox">
      <div class="mascot-cat" id="mascotCat" title="戳戳我">😺</div>
      <div class="mascot-live2d" id="mascotLive2d"><canvas id="live2dCanvas"></canvas></div>
    </div>
  </div>
  <button class="mascot-toggle" id="mascotToggle" title="隐藏看板娘" aria-label="显示/隐藏看板娘"><img src="piv/view_off.svg" alt=""></button>

  <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
  <script>
    if (typeof window.Live2DCubismCore === "undefined" || !window.Live2DCubismCore.Moc) {
      document.write('<script src="js/lib/live2dcubismcore.min.js"><\/script>');
    }
  </script>
  <script src="js/lib/pixi.min.js"></script>
  <script src="js/lib/cubism4.min.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/pjax.js"></script>
  <script src="js/log.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
